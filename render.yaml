services:
  - type: web
    name: deployments-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: deployments
      - key: CORS_ORIGINS
        value: https://deployments-frontend.onrender.com

  - type: web
    name: deployments-frontend
    runtime: docker
    rootDir: frontend
    envVars:
      - key: BACKEND_URL
        value: https://deployments-backend-iyep.onrender.com
      - key: NODE_ENV
        value: production
